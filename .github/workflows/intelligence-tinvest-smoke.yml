name: Intelligence T-Invest Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - "bot/intelligence/tinvest_runner.py"
      - "bot/intelligence/levels/level_04/historical_backtest.py"
      - "bot/intelligence/integration.py"
      - "bot/live_runner.py"
      - "bot/tinvest_client.py"
      - "requirements.txt"
      - ".github/workflows/intelligence-tinvest-smoke.yml"
  workflow_dispatch:

jobs:
  real-market-intelligence:
    name: Real T-Invest Intelligence (Read-Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install T-Invest SDK and dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip --retries 1 --timeout 30
          python -m pip install --retries 2 --timeout 30 -r requirements.txt
          python -c "from t_tech.invest import Client; print('TINVEST_SDK_IMPORT_OK')"

      - name: Verify token is configured
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: |
          if [ -z "$INVEST_TOKEN" ]; then
            echo "ERROR: GitHub secret INVEST_TOKEN is empty or missing."
            exit 1
          fi
          echo "INVEST_TOKEN_CONFIGURED=1"

      - name: Run real T-Invest Intelligence
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: python -m bot.intelligence.tinvest_runner
