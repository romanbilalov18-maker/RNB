name: Intelligence T-Invest Smoke Test

on:
  workflow_dispatch:

jobs:
  real-market-intelligence:
    name: Real T-Invest Intelligence (Read-Only)
    runs-on: ubuntu-latest
    env:
      INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --trusted-host opensource.tbank.ru \
            --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            -r requirements.txt

      - name: Verify token is configured
        run: test -n "$INVEST_TOKEN"

      - name: Run real T-Invest Intelligence
        run: python -m bot.intelligence.tinvest_runner
