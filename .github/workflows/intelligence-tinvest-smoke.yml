name: Intelligence T-Invest Smoke Test

on:
  workflow_dispatch:

jobs:
  real-market-intelligence:
    name: Real T-Invest Intelligence (Read-Only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify token is configured
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: |
          if [ -z "$INVEST_TOKEN" ]; then
            echo "ERROR: GitHub secret INVEST_TOKEN is empty or missing."
            exit 1
          fi
          echo "INVEST_TOKEN_CONFIGURED=1"

      # Preserve TLS verification while trusting T-Bank's Russian CA chain.
      - name: Configure T-Bank TLS trust
        shell: bash
        run: |
          set -euo pipefail
          cert_dir="$RUNNER_TEMP/tbank-certs"
          mkdir -p "$cert_dir"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2  https://gu-st.ru/content/Other/doc/russian_trusted_root_ca.cer  -o "$cert_dir/root.cer"
          curl --fail --show-error --silent --location --proto '=https' --tlsv1.2  https://gu-st.ru/content/Other/doc/russian_trusted_sub_ca.cer  -o "$cert_dir/sub.cer"
          for name in root sub; do
            cert="$cert_dir/$name.cer"
            if openssl x509 -in "$cert" -noout >/dev/null 2>&1; then
              cp "$cert" "$cert_dir/$name.pem"
            else
              openssl x509 -inform DER -in "$cert" -out "$cert_dir/$name.pem"
            fi
          done
          cat /etc/ssl/certs/ca-certificates.crt "$cert_dir/root.pem" "$cert_dir/sub.pem"  > "$RUNNER_TEMP/tbank-ca-bundle.pem"
          echo "SSL_CERT_FILE=$RUNNER_TEMP/tbank-ca-bundle.pem" >> "$GITHUB_ENV"
          echo "Configured system CA bundle plus T-Bank trusted certificates."

      - name: Run real T-Invest Intelligence
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: python -m bot.intelligence.tinvest_runner
