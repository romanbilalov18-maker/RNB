name: Intelligence Pipeline Test

on:
  push:
    branches:
      - feature/signal-intelligence
    paths:
      - "bot/intelligence/**"
      - "requirements.txt"
      - ".github/workflows/intelligence-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/intelligence/**"
      - "requirements.txt"
      - ".github/workflows/intelligence-pipeline.yml"
  workflow_dispatch:

jobs:
  pipeline-test:
    name: Intelligence Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --trusted-host opensource.tbank.ru \
            --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            -r requirements.txt

      - name: Run standalone Pipeline test
        run: python -m unittest bot.intelligence.tests.pipeline.test_intelligence_pipeline -v
