name: Intelligence Pipeline Test

on:
  push:
    branches:
      - main
    paths:
      - "bot/intelligence/**"
      - "tests/test_paper_cycle_persistence.py"
      - ".github/workflows/intelligence-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/intelligence/**"
      - "tests/test_paper_cycle_persistence.py"
      - ".github/workflows/intelligence-pipeline.yml"
  workflow_dispatch:

jobs:
  pipeline-test:
    name: Intelligence Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # These tests use local intelligence modules and synthetic market data.
      # Keep them independent of the T-Bank package index; SDK installation belongs
      # in the separate live T-Invest smoke test.
      - name: Run Level 10 input validation tests
        run: python -m unittest bot.intelligence.tests.levels.level_10.test_level_10 -v

      - name: Run standalone Pipeline test
        run: python -m unittest bot.intelligence.tests.pipeline.test_intelligence_pipeline -v

      - name: Run paper cycle and persistence integration tests
        run: python -m unittest discover -s tests -p 'test_paper_cycle_persistence.py' -v
