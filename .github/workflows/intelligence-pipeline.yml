name: Intelligence Pipeline Test

on:
  push:
    branches:
      - main
    paths:
      - "bot/intelligence/**"
      - ".github/workflows/intelligence-pipeline.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/intelligence/**"
      - ".github/workflows/intelligence-pipeline.yml"
  workflow_dispatch:

jobs:
  pipeline-test:
    name: Intelligence Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This pipeline test uses the local intelligence modules and synthetic market data.
      # Keep it independent of the T-Bank package index; SDK installation belongs in
      # the separate live T-Invest smoke test.
      - name: Run standalone Pipeline test
        run: python -m unittest bot.intelligence.tests.pipeline.test_intelligence_pipeline -v
