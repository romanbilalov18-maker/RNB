name: Level 1 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/intelligence/levels/level_01/**"
      - "bot/intelligence/core/models/market_snapshot.py"
      - "bot/intelligence/core/models/analysis_result.py"
      - "tests/test_level_01_historical_validation.py"
      - ".github/workflows/level-01-validation.yml"
  push:
    branches: [main]
    paths:
      - "bot/intelligence/levels/level_01/**"
      - "bot/intelligence/core/models/market_snapshot.py"
      - "bot/intelligence/core/models/analysis_result.py"
      - "tests/test_level_01_historical_validation.py"
      - ".github/workflows/level-01-validation.yml"
  workflow_dispatch:
    inputs:
      dataset_path:
        description: "CSV output/input path (default: export real candles from T-Invest)"
        required: true
        default: "data/level_01_history.csv"
        type: string
      window:
        description: "Trailing lookback rows"
        required: true
        default: "20"
        type: string
      horizon:
        description: "Rows ahead to evaluate"
        required: true
        default: "5"
        type: string

jobs:
  fast-tests:
    name: Level 1 unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Level 1 tests
        run: |
          python -m unittest bot.intelligence.tests.levels.level_01.test_level_01 -v
          python -m unittest tests.test_level_01_historical_validation -v

  historical-validation:
    name: Historical signal diagnostic (real T-Invest data)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install T-Invest SDK
        run: |
          python -m pip install --upgrade pip --retries 1 --timeout 30
          python -m pip install --retries 2 --timeout 30 -r requirements.txt
      - name: Verify T-Invest token
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: |
          if [ -z "$INVEST_TOKEN" ]; then
            echo "ERROR: GitHub secret INVEST_TOKEN is empty or missing."
            exit 1
          fi
          echo "INVEST_TOKEN_CONFIGURED=1"
      - name: Obtain real historical candles when CSV is absent
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
          DATASET_PATH: ${{ inputs.dataset_path }}
        run: |
          if [ -f "$DATASET_PATH" ]; then
            echo "Using existing CSV: $DATASET_PATH"
          else
            echo "CSV not present in repository; fetching real daily candles from T-Invest."
            python -m bot.intelligence.levels.level_01.export_historical_data \
              --output "$DATASET_PATH" --days 180
          fi
      - name: Run historical validation
        env:
          DATASET_PATH: ${{ inputs.dataset_path }}
          WINDOW: ${{ inputs.window }}
          HORIZON: ${{ inputs.horizon }}
        run: |
          python -m bot.intelligence.levels.level_01.historical_validation \
            --csv "$DATASET_PATH" --window "$WINDOW" --horizon "$HORIZON" \
            --output data/level_01_historical_report.json
      - name: Upload data and historical report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-01-historical-validation-${{ github.run_id }}
          path: |
            data/level_01_history.csv
            data/level_01_historical_report.json
          if-no-files-found: warn
          retention-days: 30
