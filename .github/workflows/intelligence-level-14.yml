name: Intelligence Level 14 Test

on:
  push:
    branches:
      - main
    paths:
      - "bot/intelligence/levels/level_14/**"
      - "bot/intelligence/tests/levels/level_14/**"
      - ".github/workflows/intelligence-level-14.yml"
  pull_request:
    branches:
      - main
    paths:
      - "bot/intelligence/levels/level_14/**"
      - "bot/intelligence/tests/levels/level_14/**"
      - ".github/workflows/intelligence-level-14.yml"
  workflow_dispatch:

jobs:
  level-14-test:
    name: Intelligence Level 14
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standalone Level 14 test
        run: python -m unittest bot.intelligence.tests.levels.level_14.test_level_14 -v
