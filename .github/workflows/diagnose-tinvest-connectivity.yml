name: Diagnose T-Invest Connectivity

on:
  workflow_dispatch:

jobs:
  connectivity:
    name: Check SDK registry and API reachability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe official registry and API endpoints
        run: |
          python - <<'PY'
          import socket
          import urllib.error
          import urllib.request

          targets = {
              "SDK_REGISTRY": ("opensource.tbank.ru", 443),
              "LIVE_API": ("invest-public-api.tbank.ru", 443),
          }

          failures = 0
          for label, (host, port) in targets.items():
              print(f"\n=== {label}: {host}:{port} ===")
              try:
                  addresses = sorted({item[4][0] for item in socket.getaddrinfo(host, port, type=socket.SOCK_STREAM)})
                  print(f"DNS_OK={','.join(addresses)}")
              except OSError as exc:
                  print(f"DNS_ERROR={type(exc).__name__}: {exc}")
                  failures += 1
                  continue

              try:
                  with socket.create_connection((host, port), timeout=8):
                      print("TCP_443_OK=1")
              except OSError as exc:
                  print(f"TCP_443_ERROR={type(exc).__name__}: {exc}")
                  failures += 1
                  continue

              if label == "SDK_REGISTRY":
                  url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple/t-tech-investments/"
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "RNB-connectivity-diagnostic"})
                      with urllib.request.urlopen(request, timeout=8) as response:
                          print(f"SDK_INDEX_HTTP_STATUS={response.status}")
                  except (urllib.error.URLError, TimeoutError, OSError) as exc:
                      print(f"SDK_INDEX_HTTP_ERROR={type(exc).__name__}: {exc}")
                      failures += 1
              else:
                  print("TCP reachability only; no authenticated API request was made.")

          print(f"\nCONNECTIVITY_DIAGNOSTIC_FAILURES={failures}")
          PY
