name: Diagnose T-Invest Connectivity

on:
  workflow_dispatch:

jobs:
  connectivity:
    name: Check T-Invest REST API reachability
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe official REST API
        run: |
          python - <<'PY'
          import urllib.error
          import urllib.request

          url = "https://invest-public-api.tbank.ru/rest/tinkoff.public.invest.api.contract.v1.InstrumentsService/Shares"
          request = urllib.request.Request(
              url,
              data=b'{"instrumentStatus":"INSTRUMENT_STATUS_BASE"}',
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=12) as response:
                  print(f"REST_API_HTTP_STATUS={response.status}")
          except urllib.error.HTTPError as exc:
              # 401/403 confirms that the REST host answered; this probe has no token.
              print(f"REST_API_HTTP_STATUS={exc.code}")
              if exc.code >= 500:
                  raise
          except (urllib.error.URLError, TimeoutError, OSError) as exc:
              raise SystemExit(f"REST_API_CONNECTION_ERROR={type(exc).__name__}: {exc}")
          PY
