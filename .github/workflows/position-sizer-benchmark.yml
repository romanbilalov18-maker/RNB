name: PositionSizer Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - "bot/position_sizer.py"
      - "scripts/benchmark_position_sizer.py"
      - ".github/workflows/position-sizer-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run bounded benchmark
        run: python scripts/benchmark_position_sizer.py
