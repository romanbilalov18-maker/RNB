name: RNB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_tinvest:
        description: "Run live T-Invest market-data smoke test"
        required: true
        default: false
        type: boolean
      run_duration_minutes:
        description: "Bot runtime in minutes"
        required: true
        default: "60"
        type: number
      cycle_interval_minutes:
        description: "Minutes between trading cycles"
        required: true
        default: "5"
        type: number

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Unit tests use local/fake data; they must not depend on T-Bank package-index uptime.
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  live-tinvest-test:
    name: Live T-Invest smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tinvest == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore virtual portfolio
        uses: actions/cache/restore@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            virtual-portfolio-${{ github.ref_name }}-

      - name: Set up portfolio directory
        run: mkdir -p data

      - name: Verify restored state
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          portfolio = Path("data/virtual_portfolio.sqlite3")
          audit = Path("data/decision_audit.sqlite")
          if portfolio.exists():
              with sqlite3.connect(portfolio) as db:
                  row = db.execute("SELECT initial_balance, cash, realized_pnl, commissions FROM portfolio WHERE id = 1").fetchone()
                  trades = db.execute("SELECT COUNT(*) FROM trades").fetchone()[0]
              print(f"RESTORED_PORTFOLIO found=1 state={row} trades={trades}")
          else:
              print("RESTORED_PORTFOLIO found=0 (first run or cache miss)")
          if audit.exists():
              with sqlite3.connect(audit) as db:
                  observations, cycles = db.execute("SELECT COUNT(*), COUNT(DISTINCT cycle_id) FROM decision_audit").fetchone()
              print(f"RESTORED_AUDIT found=1 observations={observations} cycles={cycles}")
          else:
              print("RESTORED_AUDIT found=0 (first run or cache miss)")
          PY

      - name: Install T-Invest SDK and dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip --retries 1 --timeout 30
          python -m pip install --retries 2 --timeout 30 -r requirements.txt
          python -c "from t_tech.invest import Client; print('TINVEST_SDK_IMPORT_OK')"

      - name: Verify token is configured
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: |
          if [ -z "$INVEST_TOKEN" ]; then
            echo "ERROR: GitHub secret INVEST_TOKEN is empty or missing."
            exit 1
          fi
          echo "INVEST_TOKEN_CONFIGURED=1"

      - name: Run live T-Invest test
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
          RUN_LIVE_TINVEST_TEST: "1"
          RUN_DURATION_MINUTES: ${{ inputs.run_duration_minutes }}
          CYCLE_INTERVAL_MINUTES: ${{ inputs.cycle_interval_minutes }}
        run: |
          set -o pipefail
          python -m bot.main 2>&1 | tee data/live_tinvest.log

      - name: Upload live test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tinvest-log-${{ github.run_id }}
          path: data/live_tinvest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnose decision history and build L11 report
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("data/decision_audit.sqlite")
          if not path.exists():
              print("L11_DIAGNOSTIC status=database_missing path=data/decision_audit.sqlite")
              raise SystemExit(0)

          with sqlite3.connect(path) as db:
              tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              print(f"L11_DIAGNOSTIC database_bytes={path.stat().st_size}")
              for table in ("decision_audit", "market_session_prices", "decision_outcomes", "decision_learning_snapshots"):
                  if table not in tables:
                      print(f"L11_DIAGNOSTIC table={table} status=missing")
                      continue
                  count = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  print(f"L11_DIAGNOSTIC table={table} rows={count}")
              if "decision_audit" in tables:
                  row = db.execute("SELECT COUNT(DISTINCT cycle_id), COUNT(DISTINCT ticker), MIN(recorded_at), MAX(recorded_at) FROM decision_audit").fetchone()
                  print(f"L11_DIAGNOSTIC cycles={row[0]} tickers={row[1]} first_record={row[2]} last_record={row[3]}")
          PY
          if [ -f data/decision_audit.sqlite ]; then
            python -m bot.intelligence.levels.level_11.walk_forward_report \
              --database data/decision_audit.sqlite \
              --output data/l11_walk_forward_report.json
            cat data/l11_walk_forward_report.json
          fi

      - name: Upload L11 diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l11-walk-forward-diagnostics-${{ github.run_id }}
          path: |
            data/decision_audit.sqlite
            data/l11_walk_forward_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify persisted state
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          for name, table in (("data/virtual_portfolio.sqlite3", "trades"), ("data/decision_audit.sqlite", "decision_audit")):
              path = Path(name)
              if not path.exists():
                  print(f"PERSISTED_STATE {name}: missing")
                  continue
              with sqlite3.connect(path) as db:
                  rows = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  print(f"PERSISTED_STATE {name}: rows={rows}")
                  if table == "decision_audit":
                      cycles = db.execute("SELECT COUNT(DISTINCT cycle_id) FROM decision_audit").fetchone()[0]
                      print(f"PERSISTED_STATE decision_audit cycles={cycles}")
          PY

      - name: Save virtual portfolio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
