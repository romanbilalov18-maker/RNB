name: RNB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_tinvest:
        description: "Run live T-Invest market-data smoke test"
        required: true
        default: false
        type: boolean
      run_duration_minutes:
        description: "Bot runtime in minutes"
        required: true
        default: "60"
        type: number
      cycle_interval_minutes:
        description: "Minutes between trading cycles"
        required: true
        default: "5"
        type: number

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Unit tests use local/fake data; they must not depend on T-Bank package-index uptime.
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  live-tinvest-test:
    name: Live T-Invest smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tinvest == true
    # Serialize access to the shared virtual portfolio cache.
    concurrency:
      group: rnb-virtual-portfolio-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore virtual portfolio
        uses: actions/cache/restore@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            virtual-portfolio-${{ github.ref_name }}-

      - name: Set up portfolio directory
        run: mkdir -p data

      - name: Verify restored state
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          portfolio = Path("data/virtual_portfolio.sqlite3")
          audit = Path("data/decision_audit.sqlite")
          if portfolio.exists():
              with sqlite3.connect(portfolio) as db:
                  row = db.execute("SELECT initial_balance, cash, realized_pnl, commissions FROM portfolio WHERE id = 1").fetchone()
                  trades = db.execute("SELECT COUNT(*) FROM trades").fetchone()[0]
                  position_columns = {item[1] for item in db.execute("PRAGMA table_info(positions)")}
                  required_position_columns = {
                      "ticker", "quantity", "average_price", "purchase_timestamp",
                      "purchase_session", "purchase_exchange",
                  }
                  missing_columns = required_position_columns - position_columns
                  if missing_columns:
                      raise SystemExit(
                          "RESTORED_PORTFOLIO invalid: positions schema missing "
                          + ",".join(sorted(missing_columns))
                      )
                  positions = db.execute(
                      "SELECT COUNT(*), "
                      "SUM(CASE WHEN purchase_timestamp IS NOT NULL THEN 1 ELSE 0 END), "
                      "SUM(CASE WHEN purchase_session IS NOT NULL AND purchase_session != '' THEN 1 ELSE 0 END), "
                      "SUM(CASE WHEN purchase_exchange IS NOT NULL AND purchase_exchange != '' THEN 1 ELSE 0 END), "
                      "SUM(CASE WHEN "
                      "(purchase_timestamp IS NOT NULL OR purchase_session IS NOT NULL OR purchase_exchange IS NOT NULL) "
                      "AND (purchase_timestamp IS NULL OR purchase_session IS NULL OR purchase_exchange IS NULL) "
                      "THEN 1 ELSE 0 END) FROM positions"
                  ).fetchone()
                  if positions[4]:
                      raise SystemExit(
                          f"RESTORED_PORTFOLIO invalid: {positions[4]} positions have partial entry metadata"
                      )
              print(
                  f"RESTORED_PORTFOLIO found=1 state={row} trades={trades} "
                  f"open_positions={positions[0]} "
                  f"entry_timestamps={positions[1] or 0} "
                  f"entry_sessions={positions[2] or 0} "
                  f"entry_exchanges={positions[3] or 0}"
              )
          else:
              print("RESTORED_PORTFOLIO found=0 (first run or cache miss)")
          if audit.exists():
              with sqlite3.connect(audit) as db:
                  observations, cycles = db.execute("SELECT COUNT(*), COUNT(DISTINCT cycle_id) FROM decision_audit").fetchone()
              print(f"RESTORED_AUDIT found=1 observations={observations} cycles={cycles}")
          else:
              print("RESTORED_AUDIT found=0 (first run or cache miss)")
          PY

      - name: Install T-Invest SDK and dependencies
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --upgrade pip --retries 1 --timeout 30
          python -m pip install --retries 2 --timeout 30 -r requirements.txt
          python -c "from t_tech.invest import Client; print('TINVEST_SDK_IMPORT_OK')"

      - name: Verify token is configured
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
        run: |
          if [ -z "$INVEST_TOKEN" ]; then
            echo "ERROR: GitHub secret INVEST_TOKEN is empty or missing."
            exit 1
          fi
          echo "INVEST_TOKEN_CONFIGURED=1"

      - name: Run live T-Invest test
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
          RUN_LIVE_TINVEST_TEST: "1"
          RUN_DURATION_MINUTES: ${{ inputs.run_duration_minutes }}
          CYCLE_INTERVAL_MINUTES: ${{ inputs.cycle_interval_minutes }}
        run: |
          set -o pipefail
          python -m bot.main 2>&1 | tee data/live_tinvest.log

      - name: Upload live test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tinvest-log-${{ github.run_id }}
          path: data/live_tinvest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Diagnose decision history and build L11 report
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          path = Path("data/decision_audit.sqlite")
          if not path.exists():
              print("L11_DIAGNOSTIC status=database_missing path=data/decision_audit.sqlite")
              raise SystemExit(0)

          with sqlite3.connect(path) as db:
              tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              print(f"L11_DIAGNOSTIC database_bytes={path.stat().st_size}")
              for table in ("decision_audit", "market_session_prices", "decision_outcomes", "decision_learning_snapshots"):
                  if table not in tables:
                      print(f"L11_DIAGNOSTIC table={table} status=missing")
                      continue
                  count = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  print(f"L11_DIAGNOSTIC table={table} rows={count}")
              if "decision_audit" in tables:
                  row = db.execute("SELECT COUNT(DISTINCT cycle_id), COUNT(DISTINCT ticker), MIN(recorded_at), MAX(recorded_at) FROM decision_audit").fetchone()
                  print(f"L11_DIAGNOSTIC cycles={row[0]} tickers={row[1]} first_record={row[2]} last_record={row[3]}")
          PY
          if [ -f data/decision_audit.sqlite ]; then
            python -m bot.intelligence.levels.level_11.walk_forward_report \
              --database data/decision_audit.sqlite \
              --output data/l11_walk_forward_report.json
            cat data/l11_walk_forward_report.json
          fi

      - name: Upload L11 diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l11-walk-forward-diagnostics-${{ github.run_id }}
          path: |
            data/decision_audit.sqlite
            data/l11_walk_forward_report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify persisted state
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          for name, table in (("data/virtual_portfolio.sqlite3", "trades"), ("data/decision_audit.sqlite", "decision_audit")):
              path = Path(name)
              if not path.exists():
                  print(f"PERSISTED_STATE {name}: missing")
                  continue
              with sqlite3.connect(path) as db:
                  rows = db.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  print(f"PERSISTED_STATE {name}: rows={rows}")
                  if table == "trades" and "positions" in {
                      item[0] for item in db.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                  }:
                      position_rows = db.execute(
                          "SELECT COUNT(*), "
                          "SUM(CASE WHEN purchase_timestamp IS NOT NULL THEN 1 ELSE 0 END), "
                          "SUM(CASE WHEN purchase_session IS NOT NULL AND purchase_session != '' THEN 1 ELSE 0 END), "
                          "SUM(CASE WHEN purchase_exchange IS NOT NULL AND purchase_exchange != '' THEN 1 ELSE 0 END), "
                          "SUM(CASE WHEN "
                          "(purchase_timestamp IS NOT NULL OR purchase_session IS NOT NULL OR purchase_exchange IS NOT NULL) "
                          "AND (purchase_timestamp IS NULL OR purchase_session IS NULL OR purchase_exchange IS NULL) "
                          "THEN 1 ELSE 0 END) FROM positions"
                      ).fetchone()
                      print(
                          f"PERSISTED_POSITIONS open={position_rows[0]} "
                          f"timestamps={position_rows[1] or 0} "
                          f"sessions={position_rows[2] or 0} "
                          f"exchanges={position_rows[3] or 0} "
                          f"partial_metadata={position_rows[4] or 0}"
                      )
                      if position_rows[4]:
                          raise SystemExit("PERSISTED_POSITIONS invalid: partial entry metadata")
                  if table == "decision_audit":
                      cycles = db.execute("SELECT COUNT(DISTINCT cycle_id) FROM decision_audit").fetchone()[0]
                      print(f"PERSISTED_STATE decision_audit cycles={cycles}")
          PY

      - name: Reconcile portfolio trades against decision audit
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          portfolio_path = Path("data/virtual_portfolio.sqlite3")
          audit_path = Path("data/decision_audit.sqlite")
          if not portfolio_path.exists() or not audit_path.exists():
              print(f"RECONCILIATION status=incomplete portfolio_exists={portfolio_path.exists()} audit_exists={audit_path.exists()}")
              raise SystemExit(0)

          with sqlite3.connect(portfolio_path) as db:
              db.row_factory = sqlite3.Row
              tables = {row["name"] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if "trades" not in tables or "portfolio" not in tables:
                  print("RECONCILIATION status=schema_mismatch portfolio_tables=" + ",".join(sorted(tables)))
                  raise SystemExit(0)
              portfolio = dict(db.execute("SELECT * FROM portfolio WHERE id=1").fetchone())
              trade_columns = {row["name"] for row in db.execute("PRAGMA table_info(trades)")}
              trade_count = db.execute("SELECT COUNT(*) FROM trades").fetchone()[0]
              print(f"RECONCILIATION portfolio_trade_count={trade_count} portfolio_realized_pnl={portfolio.get('realized_pnl')} portfolio_commissions={portfolio.get('commissions')} cash={portfolio.get('cash')}")

          with sqlite3.connect(audit_path) as db:
              db.row_factory = sqlite3.Row
              tables = {row["name"] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
              if "decision_audit" not in tables:
                  print("RECONCILIATION status=audit_schema_mismatch")
                  raise SystemExit(0)
              audit_count, action_rows, audit_commissions, audit_realized = db.execute("""
                  SELECT COUNT(*),
                         SUM(CASE WHEN virtual_action != 'NO_TRADE' THEN 1 ELSE 0 END),
                         COALESCE(SUM(virtual_commission), 0),
                         COALESCE(SUM(realized_pnl), 0)
                  FROM decision_audit
              """).fetchone()
              print(f"RECONCILIATION audit_rows={audit_count} action_rows={action_rows} audit_commissions={audit_commissions:.6f} audit_realized_pnl={audit_realized:.6f}")
              print("RECONCILIATION note=action_rows count ticker-cycle observations, not individual portfolio trades; compare money totals and per-trade rows separately")
          PY

      - name: Validate SQLite state before cache save
        if: always()
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          databases = {
              "data/virtual_portfolio.sqlite3": {
                  "portfolio", "positions", "trades", "equity_history",
                  "committed_cycles", "cycle_tracking_meta",
              },
              "data/decision_audit.sqlite": {
                  "decision_audit", "market_session_prices", "decision_outcomes",
                  "decision_learning_snapshots",
              },
          }
          errors = []
          for filename, required_tables in databases.items():
              path = Path(filename)
              if not path.is_file() or path.stat().st_size == 0:
                  errors.append(f"{filename}: missing or empty")
                  continue
              try:
                  with sqlite3.connect(f"file:{path}?mode=ro", uri=True) as db:
                      integrity = db.execute("PRAGMA integrity_check").fetchone()[0]
                      if integrity != "ok":
                          errors.append(f"{filename}: integrity_check={integrity}")
                      present = {
                          row[0] for row in db.execute(
                              "SELECT name FROM sqlite_master WHERE type='table'"
                          )
                      }
                      missing = required_tables - present
                      if missing:
                          errors.append(f"{filename}: missing tables {sorted(missing)}")
                      if filename.endswith("virtual_portfolio.sqlite3") and "portfolio" in present:
                          row = db.execute(
                              "SELECT COUNT(*) FROM portfolio WHERE id=1"
                          ).fetchone()[0]
                          if row != 1:
                              errors.append(f"{filename}: expected exactly one portfolio row, got {row}")
                      if filename.endswith("decision_audit.sqlite") and "decision_audit" in present:
                          bad = db.execute(
                              "SELECT COUNT(*) FROM decision_audit "
                              "WHERE cycle_id IS NULL OR ticker IS NULL OR equity IS NULL "
                              "OR cash IS NULL OR total_commissions IS NULL"
                          ).fetchone()[0]
                          if bad:
                              errors.append(f"{filename}: {bad} invalid audit rows")
              except sqlite3.Error as exc:
                  errors.append(f"{filename}: SQLite error: {exc}")

          if errors:
              for error in errors:
                  print("STATE_VALIDATION_ERROR " + error)
              raise SystemExit(1)
          print("STATE_VALIDATION_OK both SQLite databases passed integrity and schema checks")
          PY

      - name: Save virtual portfolio
        # Never cache state from a failed run or failed verification step.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
