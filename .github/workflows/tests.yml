name: RNB Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_live_tinvest:
        description: "Run live T-Invest market-data smoke test"
        required: true
        default: false
        type: boolean
      run_duration_minutes:
        description: "Bot runtime in minutes"
        required: true
        default: "60"
        type: number
      cycle_interval_minutes:
        description: "Minutes between trading cycles"
        required: true
        default: "5"
        type: number

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --trusted-host opensource.tbank.ru \
            --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  live-tinvest-test:
    name: Live T-Invest smoke test
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tinvest == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore virtual portfolio
        uses: actions/cache/restore@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            virtual-portfolio-${{ github.ref_name }}-

      - name: Set up portfolio directory
        run: mkdir -p data

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --trusted-host opensource.tbank.ru \
            --index-url https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple \
            -r requirements.txt

      - name: Run live T-Invest test
        env:
          INVEST_TOKEN: ${{ secrets.INVEST_TOKEN }}
          RUN_LIVE_TINVEST_TEST: "1"
          RUN_DURATION_MINUTES: ${{ inputs.run_duration_minutes }}
          CYCLE_INTERVAL_MINUTES: ${{ inputs.cycle_interval_minutes }}
        run: |
          python -m bot.main 2>&1 | tee data/live_tinvest.log

      - name: Upload live test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-tinvest-log-${{ github.run_id }}
          path: data/live_tinvest.log
          if-no-files-found: warn
          retention-days: 30

      - name: Save virtual portfolio
        uses: actions/cache/save@v4
        with:
          path: data
          key: virtual-portfolio-${{ github.ref_name }}-${{ github.run_id }}
